# Mantém o banco (Supabase) acordado.
# O plano gratuito do Supabase pausa o projeto depois de ~7 dias sem uso.
# Este robô do GitHub faz uma leitura simples no banco todo dia, então ele
# nunca fica parado. Não grava nada, não mexe em votos nem em notas.
#
# Usa o endereço e a chave pública (anon) que já estão no config.js.
# Para testar na hora: GitHub → aba "Actions" → "Manter o Supabase ativo"
# → botão "Run workflow".
# Se um dia falhar (projeto pausado), o GitHub manda um e-mail avisando.

name: Manter o Supabase ativo

on:
  schedule:
    - cron: '17 11 * * *'   # todo dia, 08:17 em Brasília
  workflow_dispatch:         # botão para rodar manualmente

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ler o endereço e a chave do config.js
        run: |
          URL=$(grep -oE "url: *'[^']+'" config.js | head -1 | sed -E "s/url: *'([^']+)'/\1/")
          KEY=$(grep -oE "anonKey: *'[^']+'" config.js | head -1 | sed -E "s/anonKey: *'([^']+)'/\1/")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Não achei url/anonKey no config.js"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "SB_URL=$URL" >> "$GITHUB_ENV"
          echo "SB_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Fazer uma leitura no banco
        run: |
          for tabela in "estado_votacao?select=id" "projetos?select=id&limit=1"; do
            for tentativa in 1 2 3; do
              CODIGO=$(curl -s -o resposta.json -w "%{http_code}" \
                -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
                "$SB_URL/rest/v1/$tabela")
              echo "$tabela → HTTP $CODIGO"
              [ "$CODIGO" = "200" ] && break
              sleep 20
            done
            if [ "$CODIGO" != "200" ]; then
              echo "O banco não respondeu. Abra o Supabase e veja se o projeto está pausado (botão Restore)."
              cat resposta.json || true
              exit 1
            fi
          done
          echo "Banco ativo ✔"
